<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduMesh — Institution Setup</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./components.css">
</head>
<body>
  <main class="page-center">
    <h1>Institution Setup</h1>

    <form id="setup-form">
      <label for="institution-name">Institution Name</label>
      <input type="text" id="institution-name" name="institutionName" required>

      <label for="board">Board / Curriculum</label>
      <input type="text" id="board" name="board" placeholder="e.g. CBSE, State Board" required>

      <label for="academic-year">Academic Year</label>
      <input type="text" id="academic-year" name="academicYear" placeholder="e.g. 2026-2027" required>

      <button type="submit">Save & Continue</button>
    </form>

    <!-- teacher-setup.js fills this with loading/error/success messages -->
    <div id="setup-status"></div>
  </main>

  <script type="module" src="./teacher-setup.js"></script>
</body>
</html>
