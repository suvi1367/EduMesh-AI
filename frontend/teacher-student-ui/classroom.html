<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduMesh — Start Classroom</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./components.css">
</head>
<body>
  <main class="page-center">
    <h1>Start Classroom</h1>

    <div id="pre-start">
      <label for="subject-name">Subject / Class Label</label>
      <input type="text" id="subject-name" placeholder="e.g. Grade 8 - A — Mathematics">
      <button id="start-btn" type="button">Start Classroom</button>
    </div>

    <div id="classroom-info" style="display:none;">
      <h2>Classroom is live</h2>

      <p>Classroom Code</p>
      <p id="classroom-code" class="big-code"></p>

      <p>Local Hub Address</p>
      <p id="classroom-address" class="mono"></p>

      <p><em>Students on the same Wi-Fi/LAN can join using the code above.
      (QR code display can be added once a QR library is wired in — the code
      and address are shown as text for now so the screen stays functional.)</em></p>

      <h3>Connected Students (<span id="student-count">0</span>)</h3>
      <ul id="student-list"></ul>
    </div>

    <div id="classroom-status"></div>
  </main>

  <script type="module" src="./teacher-classroom.js"></script>
</body>
</html>
