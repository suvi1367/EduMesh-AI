<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduMesh — Join Classroom</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./components.css">
</head>
<body>
  <main class="page-center">
    <h1>Join Classroom</h1>

    <div class="hub-config">
      <label for="hub-url">Hub Address</label>
      <input type="text" id="hub-url" placeholder="http://192.168.1.10:8000">
      <button id="save-hub" type="button">Save</button>
    </div>

    <form id="join-form">
      <label for="student-name">Your Name / ID</label>
      <input type="text" id="student-name" name="studentName" required>

      <label for="classroom-code">Classroom Code</label>
      <input type="text" id="classroom-code" name="classroomCode" placeholder="e.g. DEMO-CLASS" required>

      <button type="submit">Join Classroom</button>
    </form>

    <div id="join-status"></div>
  </main>

  <script type="module" src="./student-join.js"></script>
</body>
</html>
